apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: buildmart
  labels:
    app: user-service
    app.kubernetes.io/part-of: buildmart
    stage: enhanced-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/part-of: buildmart
        stage: enhanced-microservices
    spec:
      containers:
        - name: user-service
          # ECR registry: 706059253443.dkr.ecr.eu-west-3.amazonaws.com
          # (see docs/DECISION_LOG.md for creation/push details).
          image: "706059253443.dkr.ecr.eu-west-3.amazonaws.com/buildmart-user-service:latest"
          ports:
            - name: http
              containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            # Temporary stopgap - matches Baseline's value; will be
            # replaced with frontend-enhanced's real deployment URL once
            # known. See docs/DECISION_LOG.md.
            - name: CLIENT_URL
              value: "http://localhost:5173"
          envFrom:
            - secretRef:
                name: user-service-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: buildmart
  labels:
    app: user-service
    app.kubernetes.io/part-of: buildmart
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - name: http
      port: 5002
      targetPort: http
      nodePort: 30002
