apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service-hpa
  namespace: buildmart
  labels:
    app: product-service
    app.kubernetes.io/part-of: buildmart
    stage: enhanced-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  # 2-5 t3.medium nodes, each pod requesting 100m/128Mi (see
  # k8s/product-service.yaml) - 6 is comfortably within a single node's
  # capacity even before considering the other four services' pods, so
  # this leaves headroom without over-provisioning idle capacity.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: buildmart
  labels:
    app: order-service
    app.kubernetes.io/part-of: buildmart
    stage: enhanced-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
