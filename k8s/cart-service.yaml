apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: buildmart
  labels:
    app: cart-service
    app.kubernetes.io/part-of: buildmart
    stage: enhanced-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
        app.kubernetes.io/part-of: buildmart
        stage: enhanced-microservices
    spec:
      containers:
        - name: cart-service
          # ECR registry: 706059253443.dkr.ecr.eu-west-3.amazonaws.com
          # (see docs/DECISION_LOG.md for creation/push details).
          image: "706059253443.dkr.ecr.eu-west-3.amazonaws.com/buildmart-cart-service:latest"
          ports:
            - name: http
              containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            # Temporary stopgap - matches Baseline's value; will be
            # replaced with frontend-enhanced's real deployment URL once
            # known. See docs/DECISION_LOG.md.
            - name: CLIENT_URL
              value: "http://localhost:5173"
            # In-cluster Service DNS name - resolves via k8s' internal DNS
            # once product-service.yaml is applied to the same namespace.
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5001"
          envFrom:
            - secretRef:
                name: cart-service-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: buildmart
  labels:
    app: cart-service
    app.kubernetes.io/part-of: buildmart
spec:
  type: NodePort
  selector:
    app: cart-service
  ports:
    - name: http
      port: 5003
      targetPort: http
      nodePort: 30003
