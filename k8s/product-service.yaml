apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: buildmart
  labels:
    app: product-service
    app.kubernetes.io/part-of: buildmart
    stage: enhanced-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/part-of: buildmart
        stage: enhanced-microservices
    spec:
      containers:
        - name: product-service
          # ECR registry: 706059253443.dkr.ecr.eu-west-3.amazonaws.com
          # (see docs/DECISION_LOG.md for creation/push details).
          image: "706059253443.dkr.ecr.eu-west-3.amazonaws.com/buildmart-product-service:latest"
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            # Placeholder - real value is the Enhanced frontend/Gateway
            # origin once it's deployed; CORS with credentials requires an
            # exact origin, not a wildcard (same constraint as Baseline).
            # Temporary stopgap - matches Baseline's value; will be
            # replaced with frontend-enhanced's real deployment URL once
            # known. See docs/DECISION_LOG.md.
            - name: CLIENT_URL
              value: "http://localhost:5173"
          envFrom:
            - secretRef:
                name: product-service-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: buildmart
  labels:
    app: product-service
    app.kubernetes.io/part-of: buildmart
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
    - name: http
      port: 5001
      targetPort: http
      nodePort: 30001
